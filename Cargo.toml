[package]
name = "ftrans"
version = "0.5.0"
edition = "2024"
description = "Fast LAN large-file transfer, powered by iroh"

[dependencies]
iroh = "1"
iroh-blobs = { version = "0.103", features = ["fs-store"] }
iroh-mdns-address-lookup = "0.4"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
